[workspace]
resolver = "2"
members = [
    "crates/pf2e-core",
    "crates/pf2e-ai",
    "crates/pf2e-store",
    "crates/pf2e-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4"] }
pf2e-core = { path = "crates/pf2e-core" }
pf2e-ai = { path = "crates/pf2e-ai" }
pf2e-store = { path = "crates/pf2e-store" }

[profile.release]
debug = false
